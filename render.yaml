services:
  - type: web
    name: openrouter-janitor-proxy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL
        value: "google/gemini-2.5-flash-exp:free" # مثال لنموذج من OpenRouter
      - key: TEMPERATURE
        value: "1.05"
      - key: ENABLE_NSFW
        value: "true"
      - key: ENABLE_THINKING
        value: "true"
      - key: TOP_P
        value: "0.95"
      - key: MAX_TOKENS
        value: "10000"
